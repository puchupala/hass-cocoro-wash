[project]
name = "hass-cocoro-wash"
version = "0.1.1"
description = "Home Assistant custom integration for Sharp COCORO WASH washer/dryers"
requires-python = ">=3.14"
license = "MIT"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The integration ships Japanese course names and the README quotes them.
ignore = ["RUF001", "RUF002", "RUF003"]
